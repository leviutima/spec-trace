name: Publish

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run verify

      # OIDC trusted publishing needs npm >= 11.5.1. The npm bundled with
      # actions/setup-node's Node 20 is typically older than that.
      - run: npm install -g npm@latest

      # No NPM_TOKEN secret: this relies on npm's OIDC trusted publishing.
      # The package must be configured on npmjs.com (Settings > Trusted
      # Publisher) to trust this repo + workflow file before this step
      # will succeed.
      - run: npm publish --access public --provenance
